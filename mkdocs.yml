site_name: Guia Prático de CLP
site_description: Guia técnico de controladores lógicos programáveis e automação industrial
# repo_url: https://github.com/SEU-USUARIO/guia-clp
# site_url: https://SEU-USUARIO.github.io/guia-clp/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/abnt.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]

nav:
  - Início: index.md
  - 1. Fundamentos:
      - Visão geral: 01-fundamentos/index.md
      - Ciclo de varredura: 01-fundamentos/ciclo-de-varredura.md
  - 2. IEC 61131-3: 02-iec-61131-3/index.md
  - 3. Ladder (LD): 03-ladder/index.md
  - 4. FBD: 04-fbd/index.md
  - 5. Lógica e sequenciamento: 05-logica-sequenciamento/index.md
  - 6. Acionamentos e movimento: 06-acionamentos-movimento/index.md
  - 7. Instrumentação e processo: 07-instrumentacao-processo/index.md
  - 8. Comunicação e integração: 08-comunicacao/index.md
  - 9. IHM e SCADA: 09-ihm-scada/index.md
  - 10. Boas práticas: 10-boas-praticas/index.md
  - Referências: 99-referencias/index.md
